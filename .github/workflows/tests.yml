name: Tests

on:
  push:
    branches: [main, master, windows-port]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Comprobar sintaxis
        run: python -m compileall -q core services plugins ui_widgets vnc_widget main.py main_window.py

      - name: Ejecutar tests headless
        run: python -m pytest

  build-windows:
    name: EXE + instalador (windows-latest)
    runs-on: windows-latest
    needs: pytest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias de compilación
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller>=6.0 pytest>=8.0

      - name: Verificación rápida en Windows
        run: python -m pytest -q

      - name: Generar ejecutable con PyInstaller
        run: python -m PyInstaller --noconfirm --clean virtualmachine.spec

      - name: Compilar instalador con Inno Setup
        shell: pwsh
        run: |
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "No se encontró ISCC.exe en el runner de Windows" }
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC.exe devolvió $LASTEXITCODE" }

      - name: Subir artefactos
        uses: actions/upload-artifact@v4
        with:
          name: VirtualMachine-Windows
          path: |
            dist\VirtualMachine.exe
            installer\VirtualMachine-Setup-*.exe
          if-no-files-found: error
