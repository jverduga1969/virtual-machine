name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Suite de tests
    runs-on: ubuntu-latest

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-cursor0 libxkbcommon-x11-0 \
            libgl1 libegl1 \
            qemu-system-x86 qemu-utils \
            cmake libglib2.0-dev libpixman-1-dev

      - name: Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 requests packaging
          pip install qvncwidget python-xlib || true

      - name: Regenerar vnc_widget/ (port a PyQt6)
        run: python setup_vnc_widget.py || true

      - name: Ejecutar la suite de tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m unittest -v test_console_backend test_virtual_machine
